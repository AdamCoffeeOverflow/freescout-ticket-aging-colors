name: Release 1.1.10

on:
  push:
    branches:
      - 'release-1.1.10-staging'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: e91a61bb835f2b1154548dd8006bc5706bac14a1

      - name: Verify version
        run: |
          set -e
          test "$(cat version.txt)" = "1.1.10"
          php -r '$j=json_decode(file_get_contents("module.json"), true); if (!$j || $j["version"] !== "1.1.10") exit(1);'

      - name: PHP lint
        run: |
          set -e
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build module ZIP
        run: |
          set -e
          rm -rf dist AdamTicketAgingColors.zip checksums.sha256
          mkdir -p dist/AdamTicketAgingColors
          rsync -a --delete \
            --exclude '.github' \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude '*.zip' \
            ./ dist/AdamTicketAgingColors/
          cd dist
          zip -r ../AdamTicketAgingColors.zip AdamTicketAgingColors
          cd ..
          sha256sum AdamTicketAgingColors.zip > checksums.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create 1.1.10 \
            AdamTicketAgingColors.zip \
            checksums.sha256 \
            --target e91a61bb835f2b1154548dd8006bc5706bac14a1 \
            --title '1.1.10' \
            --notes $'### Fixed\n\n- Fixed the responsive conversation overview conflict reported in issue #21, targeting the official FreeScout iOS app portrait layout and tablet-width views.\n- Scoped Ticket Aging Colors’ 5px `conv-current` sizing to desktop layout only.\n- Aligned the mobile/subject-cell aging indicator with FreeScout’s actual `1000px` responsive conversation-table breakpoint.\n- Left the customer-name cell entirely under FreeScout’s responsive sizing and positioning.\n- Preserved animated, static, and reduced-motion aging indicators across responsive sizes.\n\nNo database migration or FreeScout core modification is required.\n\nPlease update and retest the official FreeScout app in portrait mode if you were affected by issue #21.'
